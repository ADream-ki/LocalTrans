name: Build Windows Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-windows:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/')
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install LLVM
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (!(Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            throw "libclang.dll not found after LLVM installation."
          }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm run build
            if ($LASTEXITCODE -eq 0) {
              break
            }

            if ($attempt -ge 3) {
              throw "Frontend build failed after 3 attempts."
            }

            Write-Warning "Frontend build failed on attempt $attempt/3. Retrying..."
            Start-Sleep -Seconds 3
          }

      - name: Validate Rust host
        shell: pwsh
        run: |
          cargo check -q --manifest-path src-tauri/Cargo.toml --no-default-features
          if ($LASTEXITCODE -ne 0) {
            throw "cargo check without features failed"
          }
          cargo check -q --manifest-path src-tauri/Cargo.toml --features loci-backend
          if ($LASTEXITCODE -ne 0) {
            throw "cargo check with loci-backend failed"
          }

      - name: Validate bundled MT runtime presence
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE "src-tauri\resources\mt-runtime"
          $bundledPython = Join-Path $runtimeRoot "python\python.exe"
          $bundledScript = Join-Path $runtimeRoot "mt_translate.py"
          $argosRoot = Join-Path $runtimeRoot "argos-packages"
          Write-Host "MT runtime root: $runtimeRoot"
          Write-Host "Bundled python: $bundledPython"
          Write-Host "Bundled script: $bundledScript"
          Write-Host "Argos root: $argosRoot"

          if (!(Test-Path $bundledPython)) {
            throw "Bundled MT python missing: $bundledPython"
          }
          if (!(Test-Path $bundledScript)) {
            throw "Bundled MT script missing: $bundledScript"
          }
          if (!(Test-Path $argosRoot)) {
            throw "Bundled Argos root missing: $argosRoot"
          }

          $argosPackageCount = (Get-ChildItem -LiteralPath $argosRoot -Directory | Measure-Object).Count
          Write-Host "Bundled Argos package directories: $argosPackageCount"
          if ($argosPackageCount -eq 0) {
            throw "Bundled Argos packages missing under: $argosRoot"
          }

  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install LLVM
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (!(Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            throw "libclang.dll not found after LLVM installation."
          }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm run build
            if ($LASTEXITCODE -eq 0) {
              break
            }

            if ($attempt -ge 3) {
              throw "Frontend build failed after 3 attempts."
            }

            Write-Warning "Frontend build failed on attempt $attempt/3. Retrying..."
            Start-Sleep -Seconds 3
          }

      - name: Validate bundled MT runtime presence
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE "src-tauri\resources\mt-runtime"
          $bundledPython = Join-Path $runtimeRoot "python\python.exe"
          $bundledScript = Join-Path $runtimeRoot "mt_translate.py"
          $argosRoot = Join-Path $runtimeRoot "argos-packages"
          Write-Host "MT runtime root: $runtimeRoot"
          Write-Host "Bundled python: $bundledPython"
          Write-Host "Bundled script: $bundledScript"
          Write-Host "Argos root: $argosRoot"

          if (!(Test-Path $bundledPython)) {
            throw "Bundled MT python missing: $bundledPython"
          }
          if (!(Test-Path $bundledScript)) {
            throw "Bundled MT script missing: $bundledScript"
          }
          if (!(Test-Path $argosRoot)) {
            throw "Bundled Argos root missing: $argosRoot"
          }

          $argosPackageCount = (Get-ChildItem -LiteralPath $argosRoot -Directory | Measure-Object).Count
          Write-Host "Bundled Argos package directories: $argosPackageCount"
          if ($argosPackageCount -eq 0) {
            throw "Bundled Argos packages missing under: $argosRoot"
          }

      - name: Build Tauri release
        run: npm run tauri build -- --features loci-backend --config src-tauri/tauri.release.conf.json

      - name: Smoke test release CLI
        shell: pwsh
        run: |
          $exe = ".\src-tauri\target\release\localtrans.exe"
          if (!(Test-Path $exe)) {
            throw "release exe not found: $exe"
          }
          & $exe workflow-profiles | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "workflow-profiles smoke test failed"
          }
          & $exe workflow-apply --profile-id meeting-low-latency | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "workflow-apply smoke test failed"
          }
          & $exe config-set --key translationEngine --value nllb | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "config-set smoke test failed"
          }
          $policy = & $exe loci-governance-snapshot | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "loci-governance-snapshot smoke test failed"
          }
          if ($policy.statusMessage -like "*feature is not enabled*") {
            throw "release build is missing loci-backend"
          }

      - name: Package portable bundle
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\package-portable.ps1 -RepoRoot $env:GITHUB_WORKSPACE

      - name: Smoke test portable bundle
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\verify-portable.ps1 -RepoRoot $env:GITHUB_WORKSPACE

      - name: Generate release checksums
        shell: pwsh
        run: |
          $artifacts = @(
            Get-ChildItem .\src-tauri\target\release\bundle\nsis\*.exe -ErrorAction SilentlyContinue
            Get-ChildItem .\src-tauri\target\release\bundle\msi\*.msi -ErrorAction SilentlyContinue
            Get-ChildItem .\artifacts\portable\*.zip -ErrorAction SilentlyContinue
          ) | Where-Object { $_ -ne $null }

          if ($artifacts.Count -eq 0) {
            throw "No release artifacts found for checksum generation."
          }

          $lines = foreach ($item in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $item.FullName).Hash.ToLowerInvariant()
            "$hash *$($item.Name)"
          }

          New-Item -ItemType Directory -Path .\artifacts\release -Force | Out-Null
          $checksumFile = ".\artifacts\release\SHA256SUMS.txt"
          $lines | Set-Content -Path $checksumFile -Encoding ascii
          Get-Content $checksumFile | Out-Host

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localtrans-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/localtrans.exe
            src-tauri/target/release/*.dll
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            artifacts/portable/*.zip
            artifacts/portable/*/portable-manifest.json
            artifacts/release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            artifacts/portable/*.zip
            artifacts/release/SHA256SUMS.txt

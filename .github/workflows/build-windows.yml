name: Build Windows Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install LLVM
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (!(Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            throw "libclang.dll not found after LLVM installation."
          }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare bundled MT runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ctranslate2 sentencepiece numpy pyyaml setuptools argostranslate
          @'
          import argostranslate.package

          argostranslate.package.update_package_index()
          available = argostranslate.package.get_available_packages()

          required_pairs = {("zh", "en"), ("en", "zh")}
          installed = set()
          for pkg in available:
              pair = (pkg.from_code, pkg.to_code)
              if pair in required_pairs and pair not in installed:
                  path = pkg.download()
                  argostranslate.package.install_from_path(path)
                  installed.add(pair)

          missing = required_pairs - installed
          if missing:
              raise RuntimeError(f"Missing Argos packages: {missing}")
          print("Installed Argos packages:", sorted(installed))
          '@ | python -
          $py = (Get-Command python).Source
          powershell -ExecutionPolicy Bypass -File .\tools\prepare_mt_runtime.ps1 -SourcePython $py -RepoRoot $env:GITHUB_WORKSPACE

      - name: Build Tauri release
        run: npm run tauri build

      - name: Smoke test release CLI
        shell: pwsh
        run: |
          $exe = ".\src-tauri\target\release\localtrans.exe"
          if (!(Test-Path $exe)) {
            throw "release exe not found: $exe"
          }
          & $exe workflow-profiles | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "workflow-profiles smoke test failed"
          }
          & $exe workflow-apply --profile-id meeting-low-latency | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "workflow-apply smoke test failed"
          }

      - name: Package portable bundle
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\package-portable.ps1 -RepoRoot $env:GITHUB_WORKSPACE

      - name: Smoke test portable bundle
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\verify-portable.ps1 -RepoRoot $env:GITHUB_WORKSPACE

      - name: Generate release checksums
        shell: pwsh
        run: |
          $artifacts = @(
            Get-ChildItem .\src-tauri\target\release\bundle\nsis\*.exe -ErrorAction SilentlyContinue
            Get-ChildItem .\src-tauri\target\release\bundle\msi\*.msi -ErrorAction SilentlyContinue
            Get-ChildItem .\artifacts\portable\*.zip -ErrorAction SilentlyContinue
          ) | Where-Object { $_ -ne $null }

          if ($artifacts.Count -eq 0) {
            throw "No release artifacts found for checksum generation."
          }

          $lines = foreach ($item in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $item.FullName).Hash.ToLowerInvariant()
            "$hash *$($item.Name)"
          }

          New-Item -ItemType Directory -Path .\artifacts\release -Force | Out-Null
          $checksumFile = ".\artifacts\release\SHA256SUMS.txt"
          $lines | Set-Content -Path $checksumFile -Encoding ascii
          Get-Content $checksumFile | Out-Host

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localtrans-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/localtrans.exe
            src-tauri/target/release/*.dll
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            artifacts/portable/*.zip
            artifacts/portable/*/portable-manifest.json
            artifacts/release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            artifacts/portable/*.zip
            artifacts/release/SHA256SUMS.txt
